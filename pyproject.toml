[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cheshu-ai"
version = "1.0.0"
description = "Single-agent vehicle manual assistant with grounded retrieval and persistent conversations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "openai-agents==0.23.1",
  "python-dotenv>=1.0",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.28", "numpy>=1.25", "faiss-cpu>=1.8"]
retrieval = [
  "faiss-cpu>=1.8",
  "numpy>=1.25",
  "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
